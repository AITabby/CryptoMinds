<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Binance yellow brain logo -->
  <defs>
    <linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD535"/>
      <stop offset="100%" style="stop-color:#f0b90b"/>
    </linearGradient>
  </defs>

  <!-- Minimal brain: two simple C-curves facing each other -->
  <path d="M28,16 C20,14 14,18 14,26 C14,34 20,40 28,38"
        fill="none" stroke="url(#p)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M36,16 C44,14 50,18 50,26 C50,34 44,40 36,38"
        fill="none" stroke="url(#p)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- 3 dots: crypto connection (Binance yellow) -->
  <circle cx="26" cy="48" r="2" fill="#FCD535"/>
  <circle cx="32" cy="48" r="2" fill="#f0b90b"/>
  <circle cx="38" cy="48" r="2" fill="#FCD535"/>
</svg>