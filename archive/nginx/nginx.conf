upstream python_api {
    server python-api:3458;
}

upstream express_api {
    server web-api:3457;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};

    location = /healthz {
        proxy_pass http://python_api;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main entry
server {
    listen 443 ssl http2;
    server_name ${NGINX_SERVER_NAME};

    # SSL certs — mounted from /etc/ssl/certs/ or generated by ssl-setup.sh
    ssl_certificate     /etc/ssl/cryptominds.pem;
    ssl_certificate_key /etc/ssl/cryptominds.key;

    # Modern TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # --- Browser-facing protocol proxy ---
    # Keep this on Express so browser requests pass through the gateway's auth/signature checks.
    location /api/v1/protocol/ {
        proxy_pass http://express_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    # --- Public Python read-only/status endpoints ---
    location ~ ^/api/v1/(info|channels|gates)$ {
        proxy_pass http://python_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://python_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://python_api;
        proxy_set_header Host $host;
    }

    # Do not expose Python's internal mutating API directly to the internet.
    location /api/v1/ {
        return 404;
    }

    # --- Express dashboard + web API ---
    location / {
        proxy_pass http://express_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
