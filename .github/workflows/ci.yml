name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install flake8
      - run: python3 -m flake8 --max-line-length=120 --exclude=node_modules,__pycache__,web/node_modules,build,agentpay_sdk .

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 -m pytest tests/ -v

  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm install
      - run: cd web && npm install
      - run: node --test tests/*.test.js

  docker-build:
    runs-on: ubuntu-latest
    needs: [pytest, node-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build