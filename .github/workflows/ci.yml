name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install flake8
      - name: Lint changed Python files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi

          files=$(git diff --name-only "$BASE" HEAD -- '*.py' \
            | grep -Ev '(^|/)(node_modules|__pycache__|build|agentpay_sdk|web/node_modules)/' || true)

          if [ -z "$files" ]; then
            echo "No changed Python files to lint."
            exit 0
          fi

          echo "$files" | xargs python3 -m flake8 --max-line-length=120

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 -m pytest tests/ -v

  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm install
      - run: node --test tests/*.test.js

  docker-build:
    runs-on: ubuntu-latest
    needs: [pytest, node-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
