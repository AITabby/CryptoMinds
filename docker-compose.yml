version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: cryptominds-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-_}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/ssl:/etc/ssl:ro
    depends_on:
      web-api:
        condition: service_healthy
      python-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  postgres:
    image: postgres:16-alpine
    container_name: cryptominds-postgres
    restart: always
    environment:
      POSTGRES_DB: cryptominds
      POSTGRES_USER: cryptominds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_SET_FOR_PROD}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptominds"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  web-api:
    build: .
    container_name: cryptominds-web
    restart: always
    expose:
      - "3457"
    environment:
      - CRYPTOMINDS_ENV=${CRYPTOMINDS_ENV:-prod}
      - PORT=3457
      - PYTHON_API_URL=http://python-api:3458
      - CRYPTOMINDS_INTERNAL_TOKEN=${CRYPTOMINDS_INTERNAL_TOKEN:-}
      - CRYPTOMINDS_DEMO=${CRYPTOMINDS_DEMO:-0}
      - DEMO_MODE=${DEMO_MODE:-false}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - ADMIN_WALLETS=${ADMIN_WALLETS:-}
      - BSC_RPC=${BSC_RPC:-https://bsc-dataseed1.binance.org/}
      - BSC_CHAIN_ID=${BSC_CHAIN_ID:-56}
      - DEPOSIT_POOL_ADDRESS=${DEPOSIT_POOL_ADDRESS:-}
      - ESCROW_CONTRACT_ADDRESS=${ESCROW_CONTRACT_ADDRESS:-}
      - WALLET_KEY_GANGDAN=${WALLET_KEY_GANGDAN:-}
      - WALLET_KEY_TIEDAN=${WALLET_KEY_TIEDAN:-}
      - WALLET_KEY_CHOUDAN=${WALLET_KEY_CHOUDAN:-}
      - WALLET_KEY_PIDAN=${WALLET_KEY_PIDAN:-}
      - WALLET_KEY_LUDAN=${WALLET_KEY_LUDAN:-}
      - WALLET_KEY_FOUR_MEME=${WALLET_KEY_FOUR_MEME:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      - ./web/cryptominds.db:/app/web/cryptominds.db
      - ./.env:/app/.env:ro
    depends_on:
      python-api:
        condition: service_healthy
    command: ["node", "web/server_modular.js"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3457/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  python-api:
    build: .
    container_name: cryptominds-python
    restart: always
    expose:
      - "3458"
    environment:
      - CRYPTOMINDS_ENV=${CRYPTOMINDS_ENV:-prod}
      - CRYPTOMINDS_API_PORT=3458
      - CRYPTOMINDS_INTERNAL_TOKEN=${CRYPTOMINDS_INTERNAL_TOKEN:-}
      - CRYPTOMINDS_DEBUG=${CRYPTOMINDS_DEBUG:-false}
      - BSC_RPC=${BSC_RPC:-https://bsc-dataseed1.binance.org/}
      - BSC_CHAIN_ID=${BSC_CHAIN_ID:-56}
      - DATABASE_URL=${DATABASE_URL:-postgresql://cryptominds:${POSTGRES_PASSWORD}@postgres:5432/cryptominds}
      - DB_BACKUP_INTERVAL_SECONDS=0
      - ESCROW_CONTRACT_ADDRESS=${ESCROW_CONTRACT_ADDRESS:-}
      - ESCROW_V2_CONTRACT_ADDRESS=${ESCROW_V2_CONTRACT_ADDRESS:-}
      - DEMO_MODE=${DEMO_MODE:-false}
      - ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY:-}
      - ARBITER_WALLETS=${ARBITER_WALLETS:-}
      - WATCHDOG_INTERVAL=${WATCHDOG_INTERVAL:-60}
      - WALLET_KEY_GANGDAN=${WALLET_KEY_GANGDAN:-}
      - WALLET_KEY_TIEDAN=${WALLET_KEY_TIEDAN:-}
      - WALLET_KEY_CHOUDAN=${WALLET_KEY_CHOUDAN:-}
      - WALLET_KEY_PIDAN=${WALLET_KEY_PIDAN:-}
      - WALLET_KEY_LUDAN=${WALLET_KEY_LUDAN:-}
      - WALLET_KEY_FOUR_MEME=${WALLET_KEY_FOUR_MEME:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python3", "api_server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3458/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  agent-tiedan:
    build: .
    container_name: cryptominds-tiedan
    restart: always
    expose:
      - "5001"
    environment:
      - CRYPTOMINDS_ENV=${CRYPTOMINDS_ENV:-prod}
      - CRYPTOMINDS_DEMO=${CRYPTOMINDS_DEMO:-0}
      - DEMO_MODE=${DEMO_MODE:-false}
      - WALLET_KEY_TIEDAN=${WALLET_KEY_TIEDAN:-}
    command: ["python3", "agents/agent_server.py", "--agent", "tiedan", "--port", "5001"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  agent-choudan:
    build: .
    container_name: cryptominds-choudan
    restart: always
    expose:
      - "5002"
    environment:
      - CRYPTOMINDS_ENV=${CRYPTOMINDS_ENV:-prod}
      - CRYPTOMINDS_DEMO=${CRYPTOMINDS_DEMO:-0}
      - DEMO_MODE=${DEMO_MODE:-false}
      - WALLET_KEY_CHOUDAN=${WALLET_KEY_CHOUDAN:-}
    command: ["python3", "agents/agent_server.py", "--agent", "choudan", "--port", "5002"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  agent-ludan:
    build: .
    container_name: cryptominds-ludan
    restart: always
    expose:
      - "5003"
    environment:
      - CRYPTOMINDS_ENV=${CRYPTOMINDS_ENV:-prod}
      - CRYPTOMINDS_DEMO=${CRYPTOMINDS_DEMO:-0}
      - DEMO_MODE=${DEMO_MODE:-false}
      - WALLET_KEY_LUDAN=${WALLET_KEY_LUDAN:-}
    command: ["python3", "agents/agent_server.py", "--agent", "ludan", "--port", "5003"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  agent-four-meme:
    build: .
    container_name: cryptominds-four-meme
    restart: always
    expose:
      - "5004"
    environment:
      - CRYPTOMINDS_ENV=${CRYPTOMINDS_ENV:-prod}
      - CRYPTOMINDS_DEMO=${CRYPTOMINDS_DEMO:-0}
      - DEMO_MODE=${DEMO_MODE:-false}
      - WALLET_KEY_FOUR_MEME=${WALLET_KEY_FOUR_MEME:-}
    command: ["python3", "agents/agent_server.py", "--agent", "four_meme", "--port", "5004"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  pgdata:
