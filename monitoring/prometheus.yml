global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cryptominds_python
    metrics_path: /metrics
    static_configs:
      - targets: ['python-api:3458']
    scheme: http

  - job_name: cryptominds_express
    metrics_path: /metrics
    static_configs:
      - targets: ['web-api:3457']
    scheme: http

  - job_name: cryptominds_postgres
    static_configs:
      - targets: ['postgres:5432']

rule_files:
  - alert_rules.yml