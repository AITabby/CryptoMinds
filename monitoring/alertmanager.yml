global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 6h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:3457/api/v1/alerts'
        send_resolved: true

  - name: 'critical'
    # Configure Slack/Discord webhook for critical alerts:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#cryptominds-critical'
    webhook_configs:
      - url: 'http://localhost:3457/api/v1/alerts'
        send_resolved: true

  - name: 'warning'
    webhook_configs:
      - url: 'http://localhost:3457/api/v1/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']