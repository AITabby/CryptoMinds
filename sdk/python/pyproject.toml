[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptominds"
version = "0.1.0"
description = "AI Agent 信任基础设施 - SACRED 信用分、托管、仲裁"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "CryptoMinds Team"}
]
keywords = ["ai", "agent", "credit", "escrow", "blockchain", "bsc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://cryptominds.ai"
Documentation = "https://docs.cryptominds.ai"
Repository = "https://github.com/cryptominds/cryptominds"
